{% set name = "karney" %}
{% set version = "1.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/karney-{{ version }}.tar.gz
  sha256: 64789300c9d860677b93ac0cc22ff2cb7cb509c43b51e63ef266a7f756eca018

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pdm-pep517
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.11.0

test:
  imports:
    - karney
  commands:
    - pip check
  requires:
    - python >={{ python_min }}
    - pip

about:
  home: https://github.com/pbrod/karney
  summary: Solves the direct and inverse geodesic problem.
  license: MIT
  license_file:
    - LICENSE
    - src/karney/license.py

extra:
  recipe-maintainers:
    - opoplawski
